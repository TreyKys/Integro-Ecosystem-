<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Integro — USSD Test Console (Account + PPSSS)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; max-width:900px; margin:24px auto; padding:16px; color:#0f172a; }
    h1 { margin-bottom:6px }
    .card { border:1px solid #e6e9ee; padding:14px; border-radius:8px; margin-bottom:14px; box-shadow: 0 1px 4px rgba(13,20,34,0.03); }
    label { display:block; margin-top:8px; font-weight:600; }
    input, select, textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #d0d7e6; box-sizing:border-box; margin-top:6px; }
    button { margin-top:12px; padding:10px 14px; border-radius:8px; background:#0b63ff; color:white; border:0; cursor:pointer; }
    pre { background:#0b1220; color:#e6f0ff; padding:12px; border-radius:6px; overflow:auto; max-height:280px; }
    .muted { color:#56616f; font-size:13px; }
    .flex { display:flex; gap:8px; }
  </style>
</head>
<body>
  <h1>Integro — USSD Test Console</h1>
  <p class="muted">Simulates: (A) Create account + DID anchor, (B) Set PIN, (C) Use PPSSS to sign a transaction.</p>

  <div class="card">
    <h3>CONFIG (auto-filled)</h3>
    <label>createAccount URL</label>
    <input id="cfg_createAccount" value="https://us-central1-integro-ecosystem.cloudfunctions.net/createAccount" />
    <label>setPin URL</label>
    <input id="cfg_setPin" value="https://us-central1-integro-ecosystem.cloudfunctions.net/setPin" />
    <label>signWithPin URL</label>
    <input id="cfg_signWithPin" value="https://us-central1-integro-ecosystem.cloudfunctions.net/signWithPin" />
    <label>getSignLog URL</label>
    <input id="cfg_getSignLog" value="https://us-central1-integro-ecosystem.cloudfunctions.net/getSignLog" />
    <div style="margin-top:8px;"><button id="saveConfigBtn">Save Config</button></div>
  </div>

  <div class="card">
    <h3>Step 1 — Create Account</h3>
    <div class="flex">
      <button id="createAcctBtn">Create Account</button>
      <button id="copyLastPrivBtn">Copy last privateKey</button>
    </div>
    <pre id="createAcctResult">No response yet.</pre>
  </div>

  <div class="card">
    <h3>Step 2 — Set PIN</h3>
    <input id="pin_accountId" placeholder="0.0.xxxxxx" />
    <input id="pin_value" placeholder="1234" />
    <div class="flex">
      <button id="setPinBtn">Set / Update PIN</button>
      <button id="revokePinBtn">Revoke PIN (admin token required)</button>
    </div>
    <pre id="setPinResult">No response yet.</pre>
  </div>

  <div class="card">
    <h3>Step 3 — Test Server-Side Signing</h3>
    <input id="sign_accountId" placeholder="0.0.xxxxxx" />
    <input id="sign_pin" placeholder="1234" />
    <select id="sign_txType">
      <option value="confirmDelivery">confirmDelivery</option>
      <option value="fundEscrow">fundEscrow</option>
    </select>
    <textarea id="sign_txParams" rows="4">{"escrowContractId":"0.0.7152729"}</textarea>
    <div style="margin-top:8px;">
      <button id="signBtn">Submit signWithPin</button>
      <button id="getLogsBtn">Fetch sign logs (admin token required)</button>
    </div>
    <pre id="signResult">No response yet.</pre>
    <pre id="logResult">No response yet.</pre>
  </div>

<script>
const $ = id => document.getElementById(id);
function loadConfig() {
  return {
    createAccountUrl: $('cfg_createAccount').value,
    setPinUrl: $('cfg_setPin').value,
    signWithPinUrl: $('cfg_signWithPin').value,
    getSignLogUrl: $('cfg_getSignLog').value
  };
}
$('saveConfigBtn').addEventListener('click', () => alert('Config saved (auto-filled defaults).'));

/* ---------- Create account ---------- */
$('createAcctBtn').addEventListener('click', async () => {
  const cfg = loadConfig();
  $('createAcctResult').textContent = 'Submitting...';
  try {
    const resp = await fetch(cfg.createAccountUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({})
    });
    const json = await resp.json();
    $('createAcctResult').textContent = JSON.stringify(json, null, 2);
    if (json.accountId) {
      $('pin_accountId').value = json.accountId;
      $('sign_accountId').value = json.accountId;
      sessionStorage.lastPrivateKey = json.privateKey || '';
    }
  } catch (err) {
    $('createAcctResult').textContent = 'ERROR: ' + (err.message || err);
  }
});
$('copyLastPrivBtn').addEventListener('click', () => {
  const p = sessionStorage.lastPrivateKey || '';
  if (!p) return alert('No privateKey stored yet.');
  navigator.clipboard.writeText(p).then(()=>alert('Private key copied.'));
});

/* ---------- setPin ---------- */
$('setPinBtn').addEventListener('click', async () => {
  const cfg = loadConfig();
  const accountId = $('pin_accountId').value.trim();
  const pin = $('pin_value').value.trim();
  $('setPinResult').textContent = 'Submitting...';
  try {
    const resp = await fetch(cfg.setPinUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ accountId, pin })
    });
    const json = await resp.json();
    $('setPinResult').textContent = JSON.stringify(json, null, 2);
  } catch (err) {
    $('setPinResult').textContent = 'ERROR: ' + (err.message || err);
  }
});

/* ---------- revokePin ---------- */
$('revokePinBtn').addEventListener('click', async () => {
  const cfg = loadConfig();
  const accountId = $('pin_accountId').value.trim();
  const adminToken = prompt('Enter ADMIN_AUTH_TOKEN:');
  $('setPinResult').textContent = 'Submitting revoke...';
  const resp = await fetch(cfg.setPinUrl.replace('/setPin','/revokePin'), {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ accountId, adminToken })
  });
  const json = await resp.json();
  $('setPinResult').textContent = JSON.stringify(json, null, 2);
});

/* ---------- signWithPin ---------- */
$('signBtn').addEventListener('click', async () => {
  const cfg = loadConfig();
  const accountId = $('sign_accountId').value.trim();
  const pin = $('sign_pin').value.trim();
  const txType = $('sign_txType').value;
  let txParams = {};
  try { txParams = JSON.parse($('sign_txParams').value); } catch(e){ alert('txParams must be valid JSON'); return; }
  $('signResult').textContent = 'Submitting...';
  try {
    const resp = await fetch(cfg.signWithPinUrl, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ accountId, pin, txType, txParams })
    });
    const json = await resp.json();
    $('signResult').textContent = JSON.stringify(json, null, 2);
  } catch (err) {
    $('signResult').textContent = 'ERROR: ' + (err.message || err);
  }
});

/* ---------- getSignLog ---------- */
$('getLogsBtn').addEventListener('click', async () => {
  const cfg = loadConfig();
  const accountId = $('sign_accountId').value.trim();
  const adminToken = prompt('Enter ADMIN_AUTH_TOKEN:');
  $('logResult').textContent = 'Fetching...';
  try {
    const url = new URL(cfg.getSignLogUrl);
    url.searchParams.set('accountId', accountId);
    url.searchParams.set('adminToken', adminToken);
    const resp = await fetch(url.toString());
    const json = await resp.json();
    $('logResult').textContent = JSON.stringify(json, null, 2);
  } catch (err) {
    $('logResult').textContent = 'ERROR: ' + (err.message || err);
  }
});
</script>
</body>
</html>
